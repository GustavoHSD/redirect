<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fuso Ferramentas | OAuth Redirect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #fbf9f8;
      --foreground: #1b1c1c;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --primary: #fd8b00;
      --primary-hover: #e57c00;
      --primary-glow: rgba(253, 139, 0, 0.1);
      --secondary: #f6f3f2;
      --secondary-hover: #e8e4e2;
      --muted: #64748b;
      --border: #c4c7c7;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.08);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.08);
      --radius: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121313;
        --foreground: #fbf9f8;
        --card: #1c1e1e;
        --card-border: #2d3030;
        --primary: #fd8b00;
        --primary-hover: #e57c00;
        --primary-glow: rgba(253, 139, 0, 0.15);
        --secondary: #2d3030;
        --secondary-hover: #3a3e3e;
        --muted: #a9aeaf;
        --border: #444748;
        --success: #10b981;
        --success-bg: rgba(16, 185, 129, 0.1);
        --error: #ef4444;
        --error-bg: rgba(239, 68, 68, 0.1);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Styling */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0c0c0c;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .header-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: justify;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: #ffffff;
      padding: 5px;
      width: 32px;
      height: 32px;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand-subtitle {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--primary);
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }
    .header-tag {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--primary);
      border: 1px solid rgba(253, 139, 0, 0.3);
      padding: 4px 8px;
      border-radius: var(--radius);
      background: rgba(253, 139, 0, 0.05);
    }

    /* Main Content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 40px 32px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
    }

    /* Dynamic State Accent Colors */
    .card.state-success::before {
      background: var(--success);
    }
    .card.state-error::before {
      background: var(--error);
    }

    /* Icon Styling */
    .status-icon-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-icon {
      width: 48px;
      height: 48px;
      display: none;
    }
    .state-success .status-icon.icon-success,
    .state-error .status-icon.icon-error,
    .state-idle .status-icon.icon-idle {
      display: block;
    }

    /* Redirect Spinner Animation */
    .redirect-spinner {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 56px;
      height: 56px;
      border: 2px solid rgba(16, 185, 129, 0.15);
      border-top-color: var(--success);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    .state-success .redirect-spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Typography */
    .card-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      text-align: center;
      color: var(--foreground);
    }

    #status {
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      color: var(--muted);
      margin: 0 0 24px;
      width: 100%;
      word-break: break-word;
    }
    .state-success #status {
      color: var(--foreground);
    }
    .state-error #status {
      color: var(--error);
      background: var(--error-bg);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    /* Progress Indicator */
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--secondary);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 24px;
      display: none;
    }
    .state-success .progress-bar-container {
      display: block;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--primary);
      transform-origin: left;
      transform: scaleX(1);
    }

    /* Data Display Area */
    .data-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid var(--card-border);
      padding-top: 24px;
    }
    .data-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .data-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .code-wrapper {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      background: var(--secondary);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--foreground);
      word-break: break-all;
      flex: 1;
      display: flex;
      align-items: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .state-code {
      min-height: 38px;
    }
    .btn-copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--secondary);
      border: 1px solid var(--card-border);
      color: var(--foreground);
      border-radius: var(--radius);
      padding: 0 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-copy:hover {
      background: var(--secondary-hover);
      border-color: var(--primary);
    }
    .btn-copy:active {
      transform: translateY(0);
    }
    .btn-copy.copied {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    /* Actions and Buttons */
    .actions-wrapper {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      user-select: none;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .btn-primary:active {
      transform: translateY(1px);
    }

    .result-message {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      min-height: 18px;
      margin-top: 4px;
    }

    /* Footer Styling */
    footer {
      padding: 20px 16px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.02);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      footer {
        background: rgba(0, 0, 0, 0.15);
      }
    }
    .footer-content {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @media (max-width: 600px) {
      .footer-content {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <div class="logo-box">
          <img src="fuso-ferrementas-logo.jpg" alt="Fuso Ferramentas Logo" class="logo-img" />
        </div>
        <div class="brand-text">
          <span class="brand-title">FUSO FERRAMENTAS</span>
          <span class="brand-subtitle">Suprimentos e Acessórios</span>
        </div>
      </div>
      <div class="header-tag">
        <span>OAUTH PORTAL</span>
      </div>
    </div>
  </header>

  <!-- Main Portal Card -->
  <main>
    <div class="card state-idle" id="portalCard">
      <!-- Status Icon -->
      <div class="status-icon-wrapper">
        <div class="redirect-spinner"></div>
        <!-- Connection/Idle Icon -->
        <svg class="status-icon icon-idle" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <!-- Success Icon -->
        <svg class="status-icon icon-success" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <!-- Error Icon -->
        <svg class="status-icon icon-error" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>

      <h2 class="card-title" id="cardTitle">Conectividade OAuth</h2>
      
      <!-- Dynanmic status message -->
      <div id="status">Aguardando dados...</div>

      <!-- Redirect Countdown Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- Content Area (Only displayed when code is present) -->
      <div id="data" class="data-container" style="display:none">
        <div class="data-field">
          <span class="data-label">Código de Autorização</span>
          <div class="code-wrapper">
            <code id="codeVal"></code>
            <button id="copyBtn" class="btn-copy">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copiar</span>
            </button>
          </div>
        </div>

        <div class="data-field" id="stateContainer">
          <span class="data-label">Identificador de Estado (State)</span>
          <code id="stateVal" class="state-code"></code>
        </div>

        <div class="actions-wrapper">
          <button id="sendBtn" class="btn-primary" style="display:none">Enviar ao backend</button>
        </div>

        <div id="sendResult" class="result-message"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <span>&copy; 2026 Fuso Ferramentas. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script>
    // Smart detection of target application from state or source
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    // Default configuration for multi-app OAuth hub
    let BACKEND_URL = '';

    // Smart route determination
    if (state === 'catalog' || (state && state.includes('catalog')) || (state && state.includes('studio'))) {
      // Direct POST to Bling Catalog Studio backend running locally on port 8000
      BACKEND_URL = 'http://localhost:8000/api/bling/oauth/callback';
    } else if (state === 'pdv' || (state && state.includes('pdv'))) {
      BACKEND_URL = 'pdv://auth';
    } else if (state === 'ml-verify' || (state && state.includes('ml-verify'))) {
      BACKEND_URL = 'com.gustavohsd.ml-verify://auth';
    } else {
      // Default fallback
      BACKEND_URL = 'http://localhost:8000/api/bling/oauth/callback';
    }

    // Determine deep link and fallback web URLs
    let deepLink = null;
    let fallbackUrl = null;

    function isWebUrl(url) {
      return url && (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('http'));
    }

    function isDeepLink(url) {
      return url && url.includes('://') && !isWebUrl(url);
    }

    // Classify BACKEND_URL
    if (isDeepLink(BACKEND_URL)) {
      deepLink = BACKEND_URL;
    } else if (isWebUrl(BACKEND_URL)) {
      fallbackUrl = BACKEND_URL;
    }

    // Classify state parameter
    if (state) {
      if (isDeepLink(state)) {
        deepLink = state;
      } else if (isWebUrl(state)) {
        fallbackUrl = state;
      }
    }

    // Helper to generate the exact redirection URL with parameters appended
    function getRedirectUrl(baseUrl, codeVal, stateVal) {
      if (!baseUrl) return '';
      let url = baseUrl;
      const separator1 = url.includes('?') ? '&' : '?';
      url += separator1 + 'code=' + encodeURIComponent(codeVal);
      // Only append state if it was not used as the baseUrl itself
      if (stateVal && baseUrl !== stateVal) {
        const separator2 = url.includes('?') ? '&' : '?';
        url += separator2 + 'state=' + encodeURIComponent(stateVal);
      }
      return url;
    }

    const portalCard = document.getElementById('portalCard');
    const cardTitle = document.getElementById('cardTitle');
    const statusEl = document.getElementById('status');
    const dataEl = document.getElementById('data');
    const codeEl = document.getElementById('codeVal');
    const stateEl = document.getElementById('stateVal');
    const copyBtn = document.getElementById('copyBtn');
    const sendBtn = document.getElementById('sendBtn');
    const sendResult = document.getElementById('sendResult');
    const progressBar = document.getElementById('progressBar');

    const REDIRECT_TIMEOUT = 2000; // milliseconds to redirect (increased for visual countdown)

    // Helper to change card state class
    function setCardState(stateClass, titleText) {
      portalCard.className = 'card ' + stateClass;
      cardTitle.textContent = titleText;
    }

    if (error) {
      setCardState('state-error', 'Erro de Autenticação');
      statusEl.textContent = 'Erro no fluxo OAuth: ' + error;
    } else if (code) {
      setCardState('state-success', 'Autorização Concluída');
      statusEl.textContent = 'Redirecionando você de volta para o aplicativo...';
      dataEl.style.display = 'flex';
      codeEl.textContent = code;

      if (state) {
        stateEl.textContent = state;
        document.getElementById('stateContainer').style.display = 'flex';
      } else {
        document.getElementById('stateContainer').style.display = 'none';
      }

      // Configure the primary action button based on the redirection type
      if (deepLink) {
        sendBtn.style.display = 'inline-flex';
        sendBtn.textContent = 'Abrir no Aplicativo';
      } else if (fallbackUrl) {
        sendBtn.style.display = 'inline-flex';
        if (fallbackUrl.startsWith('http')) {
          sendBtn.textContent = 'Enviar ao Backend';
        } else {
          sendBtn.textContent = 'Abrir no Aplicativo';
        }
      }

      // Animate progress bar countdown
      let timeLeft = REDIRECT_TIMEOUT;
      const intervalTime = 20;
      const progressTimer = setInterval(() => {
        timeLeft -= intervalTime;
        const percentage = (timeLeft / REDIRECT_TIMEOUT) * 100;
        progressBar.style.transform = `scaleX(${Math.max(0, percentage / 100)})`;
        if (timeLeft <= 0) {
          clearInterval(progressTimer);
        }
      }, intervalTime);

      // Perform automatic redirection
      setTimeout(() => {
        if (deepLink) {
          window.location.href = getRedirectUrl(deepLink, code, state);
          
          if (fallbackUrl) {
            let appOpened = false;
            const handleVisibilityChange = () => {
              if (document.hidden) appOpened = true;
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('blur', handleVisibilityChange);

            setTimeout(() => {
              document.removeEventListener('visibilitychange', handleVisibilityChange);
              window.removeEventListener('blur', handleVisibilityChange);
              if (!appOpened && !document.hidden) {
                window.location.href = getRedirectUrl(fallbackUrl, code, state);
              }
            }, 2500);
          }
        } else if (fallbackUrl) {
          window.location.href = getRedirectUrl(fallbackUrl, code, state);
        }
      }, REDIRECT_TIMEOUT);

    } else {
      setCardState('state-idle', 'Portal de Conectividade');
      statusEl.innerHTML = 'Nenhum parâmetro encontrado. Este endereço deve ser configurado como a Redirect URI oficial nas integrações de serviços do ecossistema Fuso Ferramentas.';
    }

    // Clipboard Copy Logic
    copyBtn.addEventListener('click', () => {
      const textToCopy = codeEl.textContent;
      if (!textToCopy) return;

      navigator.clipboard.writeText(textToCopy).then(() => {
        copyBtn.classList.add('copied');
        const originalContent = copyBtn.innerHTML;
        copyBtn.innerHTML = `
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copiado!</span>
        `;
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = originalContent;
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy code: ', err);
      });
    });

    // Send Button / Manual Action Logic
    sendBtn.addEventListener('click', () => {
      if (!code) return;

      if (deepLink) {
        sendResult.style.color = 'var(--primary)';
        sendResult.textContent = 'Redirecionando manualmente...';
        window.location.href = getRedirectUrl(deepLink, code, state);
        
        if (fallbackUrl) {
          let appOpened = false;
          const handleVisibilityChange = () => {
            if (document.hidden) appOpened = true;
          };
          document.addEventListener('visibilitychange', handleVisibilityChange);
          window.addEventListener('blur', handleVisibilityChange);

          setTimeout(() => {
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            window.removeEventListener('blur', handleVisibilityChange);
            if (!appOpened && !document.hidden) {
              window.location.href = getRedirectUrl(fallbackUrl, code, state);
            }
          }, 2500);
        }
      } else if (fallbackUrl) {
        if (fallbackUrl.startsWith('http')) {
          sendResult.style.color = 'var(--muted)';
          sendResult.textContent = 'Enviando ao servidor...';

          fetch(fallbackUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ code: code, state: state })
          })
          .then(response => {
            if (response.ok) {
              sendResult.style.color = 'var(--success)';
              sendResult.textContent = 'Código transmitido com sucesso!';
            } else {
              throw new Error('Código HTTP ' + response.status);
            }
          })
          .catch(err => {
            sendResult.style.color = 'var(--error)';
            sendResult.textContent = 'Falha no envio: ' + err.message;
          });
        } else {
          // Direct custom URI scheme navigation (if fallback is not http/https but another custom URI)
          sendResult.style.color = 'var(--primary)';
          sendResult.textContent = 'Redirecionando manualmente...';
          window.location.href = getRedirectUrl(fallbackUrl, code, state);
        }
      }
    });
  </script>
</body>
</html>
